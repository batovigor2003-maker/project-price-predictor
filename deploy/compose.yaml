x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://checkbilet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/checkbilet
    ports:
      - "127.0.0.1:3100:3000"
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: checkbilet
      POSTGRES_USER: checkbilet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - checkbilet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkbilet -d checkbilet"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging

volumes:
  checkbilet_postgres:
